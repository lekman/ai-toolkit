version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      # Conventional prefix so Release Please files these under Fixes rather
      # than ignoring them.
      prefix: "fix(dependabot)"
    ignore:
      # typescript-eslint refuses to load under TypeScript 7 — not degraded
      # linting, no linting at all:
      #
      #   Error: typescript-eslint does not support TS 7.0.
      #
      # No configuration avoids it. The same upgrade was checked out and run
      # in lekman/freeagent: typecheck and every test pass under TypeScript 7,
      # only the lint toolchain cannot run.
      #
      # Closing a pull request skips one version, so 7.0.3 would be raised the
      # day it ships, into a check that cannot pass.
      #
      # Minors and patches are still allowed, and typescript-eslint itself is
      # deliberately not ignored — its next release is what lifts this. Remove
      # this entry once it supports TypeScript >= 7.1:
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

      # @modelcontextprotocol/sdk pins its own zod 3 rather than resolving
      # ours, so a move to zod 4 leaves two copies in the tree and the schemas
      # we build are not the schemas its API is typed against:
      #
      #   Type 'ZodOptional<ZodString>' is not assignable to type 'AnySchema'.
      #
      # Nominal, not a shape mismatch, so there is nothing to fix on our side.
      # Confirmed in the lockfile:
      #   "@modelcontextprotocol/sdk/zod": ["zod@3.25.76", ...]
      #
      # Minors and patches still flow. Remove this entry when the SDK resolves
      # zod 4 for its own types.
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "16:00"
    groups:
      # One pull request for all actions rather than one per action: the
      # churn is what makes action updates get ignored.
      all-actions:
        patterns: ["*"]
    commit-message:
      prefix: "fix(dependabot)"
