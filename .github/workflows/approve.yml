name: Auto Approve Release Please PR

# Release Please opens the same pull request every time: version bumps and
# generated changelogs, nothing else. Reviewing it by hand adds no judgement,
# and a release pull request left sitting is how a release quietly stops
# happening.
#
# The gate moves rather than disappears. Approval is conditional on the author,
# the label and the paths touched; a release pull request that reached for
# anything else fails those checks and waits for a human.

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  auto-approve:
    name: Approve Release PR
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # Only pull requests from release-please branches.
    if: startsWith(github.head_ref, 'release-please--')
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The approver GitHub App, not a personal token: a personal token
      # expires, and when it did in lekman/auto-approve-action the step
      # answered 401 for weeks. GitHub refuses a review from the pull
      # request's author, and release-please runs as the APP_ID app, so the
      # approval comes from a second app.
      - name: Generate the approver token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.APPROVER_APP_ID }}
          private-key: ${{ secrets.APPROVER_APP_PRIVATE_KEY }}

      - name: Check the approver is not the author
        shell: bash
        env:
          APPROVER: ${{ steps.app-token.outputs.app-slug }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          if [ "${APPROVER}[bot]" = "$AUTHOR" ]; then
            echo "::error title=Auto-Approve::the approving app and the pull request author are both '$AUTHOR'. Set APPROVER_APP_ID and APPROVER_APP_PRIVATE_KEY to a second GitHub App."
            exit 1
          fi
          echo "::notice title=Auto-Approve::approving as ${APPROVER}[bot], author is $AUTHOR"

      # No continue-on-error: this job only runs on release-please branches,
      # so failing loudly here blocks nothing else. The path filters must
      # match the App-only lines in .github/CODEOWNERS.
      - name: Approve Release PR
        uses: lekman/auto-approve-action@a936b84a6b145980623b78998fca2e6a2a311413 # v1.3.5
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          allowed-authors: app/lekman-release-please-bot
          required-labels: "autorelease: pending"
          label-match-mode: all
          merge-method: squash
          # A manifest release across several packages touches more than four
          # files. Globs rather than a literal list: adding a package should
          # not silently stop approvals.
          path-filters: ".github/release-manifest.json,**/CHANGELOG.md,packages/**/package.json"

      - name: Enable auto-merge
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge "$PR_URL" --auto --squash
