<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 412" role="img" aria-labelledby="cl-title cl-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="cl-title">Three layers of control around an agent</title>
  <desc id="cl-desc">Three layers, one inside the next, around the agent. The innermost is soft controls, advice in CLAUDE.md, standards and rule files, which fails when the model ignores it. Around that are hard controls, enforced by the harness with hooks and permissions, which fail on a bug or a wrong setting. The outermost is boundary controls, enforced by the platform outside Claude, which hold even if the agent escapes the harness. Everything the agent writes and runs passes through all three.</desc>
  <style>
    .box { stroke-width: 2; }
    .band { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .hd { font-size: 18px; font-weight: 700; fill: #1f2328; }
    .sub { font-size: 14px; fill: #59636e; }
    .ttl { font-size: 20px; font-weight: 700; fill: #1f2328; }
    .dsc { font-size: 15px; fill: #32383f; }
    .tag { font-size: 12.5px; font-weight: 700; letter-spacing: 1.2px; }
    .num { font-size: 14px; font-weight: 700; text-anchor: middle; fill: #ffffff; }
    .lbl { font-size: 14px; font-weight: 600; fill: #6f7780; }
    .mid { text-anchor: middle; }
    .arw { stroke: #6f7780; stroke-width: 2.5; fill: none; }
    .opt { stroke-dasharray: 7 5; }
    .head { fill: #6f7780; }

    .g0 .box { fill: #f6f8fa; stroke: #8c959f; }
    .g0 .tag { fill: #59636e; }
    .g1 .box { fill: #ddf4ff; stroke: #0969da; }
    .g1 .tag { fill: #0550ae; }
    .g1 .dot { fill: #0969da; }
    .g2 .box { fill: #fff8c5; stroke: #9a6700; }
    .g2 .tag { fill: #7d4e00; }
    .g2 .dot { fill: #9a6700; }
    .g3 .box { fill: #dafbe1; stroke: #1a7f37; }
    .g3 .tag { fill: #116329; }
    .g3 .dot { fill: #1a7f37; }

    @media (prefers-color-scheme: dark) {
      .band { fill: #151b23; stroke: #3d444d; }
      .hd { fill: #f0f6fc; }
      .sub { fill: #9198a1; }
      .ttl { fill: #f0f6fc; }
      .dsc { fill: #d1d9e0; }
      .num { fill: #0d1117; }
      .lbl { fill: #9198a1; }
      .arw { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .g0 .box { fill: #151b23; stroke: #656d76; }
      .g0 .tag { fill: #9198a1; }
      .g1 .box { fill: #121d2f; stroke: #4493f8; }
      .g1 .tag { fill: #79c0ff; }
      .g1 .dot { fill: #4493f8; }
      .g2 .box { fill: #2a2111; stroke: #d29922; }
      .g2 .tag { fill: #e3b341; }
      .g2 .dot { fill: #d29922; }
      .g3 .box { fill: #12261e; stroke: #3fb950; }
      .g3 .tag { fill: #56d364; }
      .g3 .dot { fill: #3fb950; }
    }
  </style>
  <defs>
    <marker id="cl-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="head" d="M0 0 10 5 0 10z"/>
    </marker>
  </defs>
  <g class="g3">
    <rect class="box" x="30" y="20" width="840" height="372" rx="12"/>
  </g>
  <text class="hd" x="54" y="56">Boundary controls</text>
  <text class="sub" x="54" y="78">Enforced by the platform, outside Claude</text>
  <text class="sub" x="846" y="56" text-anchor="end">Holds even if the agent escapes the harness</text>
  <g class="g2">
    <rect class="box" x="54" y="100" width="792" height="268" rx="12"/>
  </g>
  <text class="hd" x="78" y="136">Hard controls</text>
  <text class="sub" x="78" y="158">Enforced by the harness, with hooks and permissions</text>
  <text class="sub" x="822" y="136" text-anchor="end">Fails on a bug or a wrong setting</text>
  <g class="g1">
    <rect class="box" x="78" y="180" width="744" height="164" rx="12"/>
  </g>
  <text class="hd" x="102" y="216">Soft controls</text>
  <text class="sub" x="102" y="238">Advice in CLAUDE.md, standards and rule files</text>
  <text class="sub" x="798" y="216" text-anchor="end">Fails when the model ignores it</text>
  <g class="g0" transform="translate(102 258)">
    <rect class="box" width="696" height="64" rx="10"/>
    <text class="ttl" x="24" y="40">The agent</text>
    <text class="dsc" x="150" y="40">Everything it writes and runs passes through all three</text>
  </g>
</svg>
