<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 726" role="img" aria-labelledby="rc-title rc-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="rc-title">What the ai-toolkit repository contains</title>
  <desc id="rc-desc">Three groups, by how each part is used. Copy into your configuration: standards are base instruction files for every project, rules are rule files that load for matching file paths, and security holds settings that keep secrets away from the agent. Read and apply: practices are operating models and patterns for agent work, privacy keeps personal and financial data from the model, and docs explain concepts that span the practices, such as controls. Install or run: plugins hold skills, hooks and agents for Claude Code, packages hold command line tools and MCP servers in TypeScript, and repo guards are hooks and checks that keep client names out of a repository.</desc>
  <style>
    .box { stroke-width: 2; }
    .band { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .hd { font-size: 18px; font-weight: 700; fill: #1f2328; }
    .sub { font-size: 14px; fill: #59636e; }
    .ttl { font-size: 20px; font-weight: 700; fill: #1f2328; }
    .dsc { font-size: 15px; fill: #32383f; }
    .tag { font-size: 12.5px; font-weight: 700; letter-spacing: 1.2px; }
    .num { font-size: 14px; font-weight: 700; text-anchor: middle; fill: #ffffff; }
    .lbl { font-size: 14px; font-weight: 600; fill: #6f7780; }
    .mid { text-anchor: middle; }
    .arw { stroke: #6f7780; stroke-width: 2.5; fill: none; }
    .opt { stroke-dasharray: 7 5; }
    .head { fill: #6f7780; }

    .g0 .box { fill: #f6f8fa; stroke: #8c959f; }
    .g0 .tag { fill: #59636e; }
    .g1 .box { fill: #ddf4ff; stroke: #0969da; }
