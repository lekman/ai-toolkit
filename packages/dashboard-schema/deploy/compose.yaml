# Postgres for the dashboard, on the Mac Mini (OrbStack).
# Reachable on the tailnet address only; 7400, 7401 and 7432 belong to Atlas.
#   cp .env.example .env   # then set a generated password, chmod 600 .env
#   docker compose up -d
name: dashboard-db
services:
  postgres:
    image: postgres:17.6-alpine
    container_name: dashboard-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: dashboard
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: ${DASHBOARD_DB_PASSWORD:?set DASHBOARD_DB_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "${DASHBOARD_DB_BIND:-127.0.0.1}:5440:5432"
    volumes:
      - dashboard-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard -d dashboard"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  dashboard-db-data:
