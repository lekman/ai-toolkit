<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fixture framed chart</title>
    <style>
      body {
        margin: 0;
        font:
          18px system-ui,
          sans-serif;
      }
      header {
        height: 70px;
        padding: 10px 20px;
        background: #1d2733;
        color: #fff;
      }
      iframe {
        margin-left: 90px;
        border: 0;
        width: 460px;
        height: 240px;
      }
    </style>
  </head>
  <body>
    <header>Portal</header>
    <!-- Sandboxed without allow-same-origin, as an untrusted chart would be. -->
    <iframe
      title="Chart"
      sandbox="allow-scripts"
      srcdoc="<!doctype html>
<body style='margin:0;font:18px system-ui,sans-serif'>
<svg id='chart' width='400' height='160' style='margin:20px 30px 6px;background:#eef2f6;touch-action:none'></svg>
<p id='status' style='margin:0 30px'>Waiting</p>
<script>
  const chart = document.getElementById('chart');
  const status = document.getElementById('status');
  const pct = (e) => {
    const r = chart.getBoundingClientRect();
    return Math.round(((e.clientX - r.left) / r.width) * 100);
  };
  let start = null;
  let moves = 0;
  chart.addEventListener('pointerdown', (e) => {
    chart.setPointerCapture(e.pointerId);
    start = pct(e);
    moves = 0;
  });
  chart.addEventListener('pointermove', () => {
    if (start !== null) moves++;
  });
  chart.addEventListener('pointerup', (e) => {
    status.textContent = 'Dragged ' + start + '% to ' + pct(e) + '% in ' + moves + ' moves';
    start = null;
  });
</script>
</body>"
    ></iframe>
  </body>
</html>
