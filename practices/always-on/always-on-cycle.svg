<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="ao-title ao-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="ao-title">The cycle of an always-on agent</title>
  <desc id="ao-desc">Six steps in a loop. One, an event arrives in the event inbox, where a message, a timer or a change is stored first. Two, one worker starts one run and takes the waiting events together. Three, the agent loads what it knows from memory, which holds instructions, notes and task progress. Four, permissions check each tool call, which is allowed, blocked, or sent to a person to approve. Five, the outbox sends a message, sends nothing, or holds a call that waits. Six, timers let the agent sleep until a follow-up is due, and that follow-up becomes the next event, which starts the cycle again. A person answers and approves, the agent does the run, and the machine stores and schedules.</desc>
  <style>
    .box { stroke-width: 2; }
    .band { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .hd { font-size: 18px; font-weight: 700; fill: #1f2328; }
    .sub { font-size: 14px; fill: #59636e; }
    .ttl { font-size: 20px; font-weight: 700; fill: #1f2328; }
    .dsc { font-size: 15px; fill: #32383f; }
    .tag { font-size: 12.5px; font-weight: 700; letter-spacing: 1.2px; }
    .num { font-size: 14px; font-weight: 700; text-anchor: middle; fill: #ffffff; }
    .lbl { font-size: 14px; font-weight: 600; fill: #6f7780; }
    .mid { text-anchor: middle; }
    .arw { stroke: #6f7780; stroke-width: 2.5; fill: none; }
    .opt { stroke-dasharray: 7 5; }
    .head { fill: #6f7780; }

    .g0 .box { fill: #f6f8fa; stroke: #8c959f; }
    .g0 .tag { fill: #59636e; }
    .g1 .box { fill: #ddf4ff; stroke: #0969da; }
    .g1 .tag { fill: #0550ae; }
    .g1 .dot { fill: #0969da; }
    .g2 .box { fill: #fff8c5; stroke: #9a6700; }
    .g2 .tag { fill: #7d4e00; }
    .g2 .dot { fill: #9a6700; }
    .g3 .box { fill: #dafbe1; stroke: #1a7f37; }
    .g3 .tag { fill: #116329; }
    .g3 .dot { fill: #1a7f37; }

    @media (prefers-color-scheme: dark) {
      .band { fill: #151b23; stroke: #3d444d; }
      .hd { fill: #f0f6fc; }
      .sub { fill: #9198a1; }
      .ttl { fill: #f0f6fc; }
      .dsc { fill: #d1d9e0; }
      .num { fill: #0d1117; }
      .lbl { fill: #9198a1; }
      .arw { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .g0 .box { fill: #151b23; stroke: #656d76; }
      .g0 .tag { fill: #9198a1; }
      .g1 .box { fill: #121d2f; stroke: #4493f8; }
      .g1 .tag { fill: #79c0ff; }
      .g1 .dot { fill: #4493f8; }
      .g2 .box { fill: #2a2111; stroke: #d29922; }
      .g2 .tag { fill: #e3b341; }
      .g2 .dot { fill: #d29922; }
      .g3 .box { fill: #12261e; stroke: #3fb950; }
      .g3 .tag { fill: #56d364; }
      .g3 .dot { fill: #3fb950; }
    }
  </style>
  <defs>
    <marker id="ao-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="head" d="M0 0 10 5 0 10z"/>
    </marker>
  </defs>
  <g class="g3" transform="translate(30 20)">
    <rect class="box" width="250" height="124" rx="10"/>
    <circle class="dot" cx="31" cy="27" r="13"/>
    <text class="num" x="31" y="32">1</text>
    <text class="tag" x="54" y="32">EVENT INBOX</text>
    <text class="ttl" x="18" y="68">An event arrives</text>
    <text class="dsc" x="18" y="91">A message, a timer or a</text>
    <text class="dsc" x="18" y="110">change is stored first</text>
  </g>
  <g class="g3" transform="translate(325 20)">
    <rect class="box" width="250" height="124" rx="10"/>
    <circle class="dot" cx="31" cy="27" r="13"/>
    <text class="num" x="31" y="32">2</text>
    <text class="tag" x="54" y="32">WORKER</text>
    <text class="ttl" x="18" y="68">One run starts</text>
    <text class="dsc" x="18" y="91">One worker takes the</text>
    <text class="dsc" x="18" y="110">waiting events together</text>
  </g>
  <g class="g2" transform="translate(620 20)">
    <rect class="box" width="250" height="124" rx="10"/>
    <circle class="dot" cx="31" cy="27" r="13"/>
    <text class="num" x="31" y="32">3</text>
    <text class="tag" x="54" y="32">MEMORY</text>
    <text class="ttl" x="18" y="68">Load what it knows</text>
    <text class="dsc" x="18" y="91">Instructions, notes and</text>
    <text class="dsc" x="18" y="110">task progress</text>
  </g>
  <g class="g1" transform="translate(30 232)">
    <rect class="box" width="250" height="124" rx="10"/>
    <circle class="dot" cx="31" cy="27" r="13"/>
    <text class="num" x="31" y="32">4</text>
    <text class="tag" x="54" y="32">PERMISSIONS</text>
    <text class="ttl" x="18" y="68">Check each call</text>
    <text class="dsc" x="18" y="91">Allowed, blocked, or sent</text>
    <text class="dsc" x="18" y="110">to a person to approve</text>
  </g>
  <g class="g2" transform="translate(325 232)">
    <rect class="box" width="250" height="124" rx="10"/>
    <circle class="dot" cx="31" cy="27" r="13"/>
    <text class="num" x="31" y="32">5</text>
    <text class="tag" x="54" y="32">OUTBOX</text>
    <text class="ttl" x="18" y="68">Send or stay quiet</text>
    <text class="dsc" x="18" y="91">A message, nothing, or a</text>
    <text class="dsc" x="18" y="110">call that waits</text>
  </g>
  <g class="g3" transform="translate(620 232)">
    <rect class="box" width="250" height="124" rx="10"/>
    <circle class="dot" cx="31" cy="27" r="13"/>
    <text class="num" x="31" y="32">6</text>
    <text class="tag" x="54" y="32">TIMERS</text>
    <text class="ttl" x="18" y="68">Sleep until due</text>
    <text class="dsc" x="18" y="91">A follow-up becomes the</text>
    <text class="dsc" x="18" y="110">next event</text>
  </g>
  <path class="arw" d="M284 82H319" marker-end="url(#ao-head)"/>
  <path class="arw" d="M579 82H614" marker-end="url(#ao-head)"/>
  <path class="arw" d="M745 148V188H155V226" marker-end="url(#ao-head)"/>
  <path class="arw" d="M284 294H319" marker-end="url(#ao-head)"/>
  <path class="arw" d="M579 294H614" marker-end="url(#ao-head)"/>
  <path class="arw opt" d="M745 360V388H14V82H24" marker-end="url(#ao-head)"/>
  <text class="lbl" x="54" y="410">The next event starts the cycle again</text>
  <g class="g1" transform="translate(30 432)">
    <rect class="box" width="18" height="18" rx="4"/>
    <text class="lbl" x="28" y="14">Person answers and approves</text>
  </g>
  <g class="g2" transform="translate(325 432)">
    <rect class="box" width="18" height="18" rx="4"/>
    <text class="lbl" x="28" y="14">Agent does the run</text>
  </g>
  <g class="g3" transform="translate(620 432)">
    <rect class="box" width="18" height="18" rx="4"/>
    <text class="lbl" x="28" y="14">Machine stores and schedules</text>
  </g>
</svg>
