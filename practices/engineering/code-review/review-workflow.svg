<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 426" role="img" aria-labelledby="rv-title rv-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="rv-title">The workflow for agent code review</title>
  <desc id="rv-desc">Six steps. 1, a person writes one instruction file for each reviewer and changes it like code. 2, the coding agent runs a local review before the pull request, for two rounds at most. 3, reviewer agents comment on one pull request, or on each piece of a stack. 4, the coding agent answers each comment in its own thread as fixed, declined or deferred. When fixes are pushed, the reviewers review again. 5, a machine blocks the merge while any thread is open. 6, a written policy approves and merges, and a person approves only where the risk calls for one.</desc>
  <style>
    .box { stroke-width: 2; }
    .ttl { font-size: 20px; font-weight: 700; fill: #1f2328; }
    .dsc { font-size: 15px; fill: #32383f; }
    .tag { font-size: 12.5px; font-weight: 700; letter-spacing: 1.2px; }
    .num { font-size: 14px; font-weight: 700; text-anchor: middle; fill: #ffffff; }
    .lbl { font-size: 14px; font-weight: 600; fill: #6f7780; }
    .mid { text-anchor: middle; }
    .arw { stroke: #6f7780; stroke-width: 2.5; fill: none; }
    .opt { stroke-dasharray: 7 5; }
    .head { fill: #6f7780; }

    .person .box { fill: #ddf4ff; stroke: #0969da; }
    .person .tag { fill: #0550ae; }
    .person .dot { fill: #0969da; }
    .agent .box { fill: #fff8c5; stroke: #9a6700; }
    .agent .tag { fill: #7d4e00; }
    .agent .dot { fill: #9a6700; }
    .machine .box { fill: #dafbe1; stroke: #1a7f37; }
    .machine .tag { fill: #116329; }
    .machine .dot { fill: #1a7f37; }

    @media (prefers-color-scheme: dark) {
      .ttl { fill: #f0f6fc; }
      .dsc { fill: #d1d9e0; }
      .num { fill: #0d1117; }
      .lbl { fill: #9198a1; }
      .arw { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .person .box { fill: #121d2f; stroke: #4493f8; }
      .person .tag { fill: #79c0ff; }
      .person .dot { fill: #4493f8; }
      .agent .box { fill: #2a2111; stroke: #d29922; }
      .agent .tag { fill: #e3b341; }
      .agent .dot { fill: #d29922; }
      .machine .box { fill: #12261e; stroke: #3fb950; }
      .machine .tag { fill: #56d364; }
      .machine .dot { fill: #3fb950; }
    }
  </style>
  <defs>
    <marker id="rv-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="head" d="M0 0 10 5 0 10z"/>
    </marker>
  </defs>

  <!-- Row one, left to right -->
  <g class="person" transform="translate(30 24)">
    <rect class="box" width="250" height="124" rx="10"/>
    <circle class="dot" cx="31" cy="27" r="13"/>
    <text class="num" x="31" y="32">1</text>
    <text class="tag" x="54" y="32">PERSON</text>
    <text class="ttl" x="18" y="68">Instructions</text>
    <text class="dsc" x="18" y="91">One file for each reviewer,</text>
    <text class="dsc" x="18" y="110">changed like code</text>
  </g>
  <path class="arw" d="M284 86H319" marker-end="url(#rv-head)"/>

  <g class="agent" transform="translate(325 24)">
    <rect class="box" width="250" height="124" rx="10"/>
    <circle class="dot" cx="31" cy="27" r="13"/>
    <text class="num" x="31" y="32">2</text>
    <text class="tag" x="54" y="32">AGENT</text>
    <text class="ttl" x="18" y="68">Local review</text>
    <text class="dsc" x="18" y="91">Before the pull request,</text>
    <text class="dsc" x="18" y="110">two rounds at most</text>
  </g>
  <path class="arw" d="M579 86H614" marker-end="url(#rv-head)"/>

  <g class="agent" transform="translate(620 24)">
    <rect class="box" width="250" height="124" rx="10"/>
    <circle class="dot" cx="31" cy="27" r="13"/>
    <text class="num" x="31" y="32">3</text>
    <text class="tag" x="54" y="32">AGENT</text>
    <text class="ttl" x="18" y="68">Reviewers comment</text>
    <text class="dsc" x="18" y="91">On one pull request, or on</text>
    <text class="dsc" x="18" y="110">each piece of a stack</text>
  </g>
  <path class="arw" d="M665 152V230" marker-end="url(#rv-head)"/>
  <path class="arw opt" d="M825 232V154" marker-end="url(#rv-head)"/>
  <text class="lbl mid" x="745" y="197">fixes pushed</text>

  <!-- Row two, right to left -->
  <g class="agent" transform="translate(620 236)">
    <rect class="box" width="250" height="124" rx="10"/>
    <circle class="dot" cx="31" cy="27" r="13"/>
    <text class="num" x="31" y="32">4</text>
    <text class="tag" x="54" y="32">AGENT</text>
    <text class="ttl" x="18" y="68">Answer comments</text>
    <text class="dsc" x="18" y="91">Fixed, declined or deferred,</text>
    <text class="dsc" x="18" y="110">one reply in each thread</text>
  </g>
  <path class="arw" d="M616 298H581" marker-end="url(#rv-head)"/>

  <g class="machine" transform="translate(325 236)">
    <rect class="box" width="250" height="124" rx="10"/>
    <circle class="dot" cx="31" cy="27" r="13"/>
    <text class="num" x="31" y="32">5</text>
    <text class="tag" x="54" y="32">MACHINE</text>
    <text class="ttl" x="18" y="68">Threads resolved</text>
    <text class="dsc" x="18" y="91">Merge stays blocked while</text>
    <text class="dsc" x="18" y="110">any thread is open</text>
  </g>
  <path class="arw" d="M321 298H286" marker-end="url(#rv-head)"/>

  <g class="machine" transform="translate(30 236)">
    <rect class="box" width="250" height="124" rx="10"/>
    <circle class="dot" cx="31" cy="27" r="13"/>
    <text class="num" x="31" y="32">6</text>
    <text class="tag" x="54" y="32">MACHINE</text>
    <text class="ttl" x="18" y="68">Approve and merge</text>
    <text class="dsc" x="18" y="91">By policy. A person only</text>
    <text class="dsc" x="18" y="110">where the risk calls for one</text>
  </g>

  <!-- Legend -->
  <g class="person" transform="translate(30 392)">
    <rect class="box" width="18" height="18" rx="4"/>
    <text class="lbl" x="28" y="14">Person sets goals and rules</text>
  </g>
  <g class="agent" transform="translate(325 392)">
    <rect class="box" width="18" height="18" rx="4"/>
    <text class="lbl" x="28" y="14">Agent builds and reviews</text>
  </g>
  <g class="machine" transform="translate(620 392)">
    <rect class="box" width="18" height="18" rx="4"/>
    <text class="lbl" x="28" y="14">Machine proves the result</text>
  </g>
</svg>
