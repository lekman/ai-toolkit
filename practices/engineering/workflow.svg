<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 566" role="img" aria-labelledby="wf-title wf-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="wf-title">The workflow for engineering with agents</title>
  <desc id="wf-desc">Six steps in a loop. 1, a person sets a business goal with a measure. 2, a person writes the specification as scenarios and a staged plan. An optional prototype, built by an agent and thrown away, feeds what was learned into the specification. 3, agents work in short sessions, each subagent in its own worktree. 4, a machine runs mechanical checks that nobody can skip, and each failure names its fix. 5, reviewer agents review the work in pieces, as one pull request or a stack that merges in one go, and a policy approves it. 6, a person reads the measured impact, which leads to the next goal.</desc>
  <style>
    .box { stroke-width: 2; }
    .ttl { font-size: 20px; font-weight: 700; fill: #1f2328; }
    .dsc { font-size: 15px; fill: #32383f; }
    .tag { font-size: 12.5px; font-weight: 700; letter-spacing: 1.2px; }
    .num { font-size: 14px; font-weight: 700; text-anchor: middle; fill: #ffffff; }
    .lbl { font-size: 14px; font-weight: 600; fill: #6f7780; }
    .arw { stroke: #6f7780; stroke-width: 2.5; fill: none; }
    .opt { stroke-dasharray: 7 5; }
    .head { fill: #6f7780; }

    .person .box { fill: #ddf4ff; stroke: #0969da; }
    .person .tag { fill: #0550ae; }
    .person .dot { fill: #0969da; }
    .agent .box { fill: #fff8c5; stroke: #9a6700; }
    .agent .tag { fill: #7d4e00; }
    .agent .dot { fill: #9a6700; }
    .machine .box { fill: #dafbe1; stroke: #1a7f37; }
    .machine .tag { fill: #116329; }
    .machine .dot { fill: #1a7f37; }

    @media (prefers-color-scheme: dark) {
      .ttl { fill: #f0f6fc; }
      .dsc { fill: #d1d9e0; }
      .num { fill: #0d1117; }
      .lbl { fill: #9198a1; }
      .arw { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .person .box { fill: #121d2f; stroke: #4493f8; }
      .person .tag { fill: #79c0ff; }
      .person .dot { fill: #4493f8; }
      .agent .box { fill: #2a2111; stroke: #d29922; }
      .agent .tag { fill: #e3b341; }
      .agent .dot { fill: #d29922; }
      .machine .box { fill: #12261e; stroke: #3fb950; }
      .machine .tag { fill: #56d364; }
      .machine .dot { fill: #3fb950; }
    }
  </style>
  <defs>
    <marker id="wf-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="head" d="M0 0 10 5 0 10z"/>
    </marker>
  </defs>

  <!-- Optional input: the prototype feeds the specification -->
  <g class="agent" transform="translate(325 20)">
    <rect class="box opt" width="250" height="84" rx="10"/>
    <text class="tag" x="18" y="27">AGENT · OPTIONAL</text>
    <text class="ttl" x="18" y="52">Prototype</text>
    <text class="dsc" x="18" y="72">Cheap, then thrown away</text>
  </g>
  <path class="arw opt" d="M450 108V158" marker-end="url(#wf-head)"/>
  <text class="lbl" x="464" y="138">what you learned</text>

  <!-- Row one, left to right -->
  <g class="person" transform="translate(30 164)">
    <rect class="box" width="250" height="124" rx="10"/>
    <circle class="dot" cx="31" cy="27" r="13"/>
    <text class="num" x="31" y="32">1</text>
    <text class="tag" x="54" y="32">PERSON</text>
    <text class="ttl" x="18" y="68">Business goal</text>
    <text class="dsc" x="18" y="91">Who benefits, and the</text>
    <text class="dsc" x="18" y="110">number that shows it</text>
  </g>
  <path class="arw" d="M284 226H319" marker-end="url(#wf-head)"/>

  <g class="person" transform="translate(325 164)">
    <rect class="box" width="250" height="124" rx="10"/>
    <circle class="dot" cx="31" cy="27" r="13"/>
    <text class="num" x="31" y="32">2</text>
    <text class="tag" x="54" y="32">PERSON</text>
    <text class="ttl" x="18" y="68">Specification</text>
    <text class="dsc" x="18" y="91">Scenarios that pass or fail,</text>
    <text class="dsc" x="18" y="110">and a plan in stages</text>
  </g>
  <path class="arw" d="M579 226H614" marker-end="url(#wf-head)"/>

  <g class="agent" transform="translate(620 164)">
    <rect class="box" width="250" height="124" rx="10"/>
    <circle class="dot" cx="31" cy="27" r="13"/>
    <text class="num" x="31" y="32">3</text>
    <text class="tag" x="54" y="32">AGENT</text>
    <text class="ttl" x="18" y="68">Short sessions</text>
    <text class="dsc" x="18" y="91">Subagents work from the</text>
    <text class="dsc" x="18" y="110">spec, one worktree each</text>
  </g>
  <path class="arw" d="M745 292V370" marker-end="url(#wf-head)"/>

  <!-- Row two, right to left -->
  <g class="machine" transform="translate(620 376)">
    <rect class="box" width="250" height="124" rx="10"/>
    <circle class="dot" cx="31" cy="27" r="13"/>
    <text class="num" x="31" y="32">4</text>
    <text class="tag" x="54" y="32">MACHINE</text>
    <text class="ttl" x="18" y="68">Mechanical checks</text>
    <text class="dsc" x="18" y="91">Gates nobody can skip,</text>
    <text class="dsc" x="18" y="110">each failure names its fix</text>
  </g>
  <path class="arw" d="M616 438H581" marker-end="url(#wf-head)"/>

  <g class="agent" transform="translate(325 376)">
    <rect class="box" width="250" height="124" rx="10"/>
    <circle class="dot" cx="31" cy="27" r="13"/>
    <text class="num" x="31" y="32">5</text>
    <text class="tag" x="54" y="32">AGENT</text>
    <text class="ttl" x="18" y="68">Review in pieces</text>
    <text class="dsc" x="18" y="91">One pull request, or a stack</text>
    <text class="dsc" x="18" y="110">that merges in one go</text>
  </g>
  <path class="arw" d="M321 438H286" marker-end="url(#wf-head)"/>

  <g class="person" transform="translate(30 376)">
    <rect class="box" width="250" height="124" rx="10"/>
    <circle class="dot" cx="31" cy="27" r="13"/>
    <text class="num" x="31" y="32">6</text>
    <text class="tag" x="54" y="32">PERSON</text>
    <text class="ttl" x="18" y="68">Measured impact</text>
    <text class="dsc" x="18" y="91">Is it used, and did</text>
    <text class="dsc" x="18" y="110">the number move?</text>
  </g>
  <path class="arw opt" d="M155 372V294" marker-end="url(#wf-head)"/>
  <text class="lbl" x="169" y="338">next goal</text>

  <!-- Legend -->
  <g class="person" transform="translate(30 532)">
    <rect class="box" width="18" height="18" rx="4"/>
    <text class="lbl" x="28" y="14">Person sets goals and rules</text>
  </g>
  <g class="agent" transform="translate(325 532)">
    <rect class="box" width="18" height="18" rx="4"/>
    <text class="lbl" x="28" y="14">Agent builds and reviews</text>
  </g>
  <g class="machine" transform="translate(620 532)">
    <rect class="box" width="18" height="18" rx="4"/>
    <text class="lbl" x="28" y="14">Machine proves the result</text>
  </g>
</svg>
