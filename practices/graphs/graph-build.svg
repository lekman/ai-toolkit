<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 578" role="img" aria-labelledby="gb-title gb-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="gb-title">How a codebase graph is built</title>
  <desc id="gb-desc">Two groups in order, then a result. Scripts are cheap and exact. They scan the files in scope, group them into batches sized for one analysis, and extract the structure with tree-sitter. Agents are expensive and interpretive. They run the semantic analysis that adds summaries, tags and edges, review the assembly and assign layers, and design a tour. The result is a knowledge graph that holds files, symbols, layers and tours in one file.</desc>
  <style>
    .box { stroke-width: 2; }
    .band { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .hd { font-size: 18px; font-weight: 700; fill: #1f2328; }
    .sub { font-size: 14px; fill: #59636e; }
    .ttl { font-size: 20px; font-weight: 700; fill: #1f2328; }
    .dsc { font-size: 15px; fill: #32383f; }
    .tag { font-size: 12.5px; font-weight: 700; letter-spacing: 1.2px; }
    .num { font-size: 14px; font-weight: 700; text-anchor: middle; fill: #ffffff; }
    .lbl { font-size: 14px; font-weight: 600; fill: #6f7780; }
    .mid { text-anchor: middle; }
    .arw { stroke: #6f7780; stroke-width: 2.5; fill: none; }
    .opt { stroke-dasharray: 7 5; }
    .head { fill: #6f7780; }

    .g0 .box { fill: #f6f8fa; stroke: #8c959f; }
    .g0 .tag { fill: #59636e; }
    .g1 .box { fill: #ddf4ff; stroke: #0969da; }
    .g1 .tag { fill: #0550ae; }
    .g1 .dot { fill: #0969da; }
    .g2 .box { fill: #fff8c5; stroke: #9a6700; }
    .g2 .tag { fill: #7d4e00; }
    .g2 .dot { fill: #9a6700; }
    .g3 .box { fill: #dafbe1; stroke: #1a7f37; }
    .g3 .tag { fill: #116329; }
    .g3 .dot { fill: #1a7f37; }

    @media (prefers-color-scheme: dark) {
      .band { fill: #151b23; stroke: #3d444d; }
      .hd { fill: #f0f6fc; }
      .sub { fill: #9198a1; }
      .ttl { fill: #f0f6fc; }
      .dsc { fill: #d1d9e0; }
      .num { fill: #0d1117; }
      .lbl { fill: #9198a1; }
      .arw { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .g0 .box { fill: #151b23; stroke: #656d76; }
      .g0 .tag { fill: #9198a1; }
      .g1 .box { fill: #121d2f; stroke: #4493f8; }
      .g1 .tag { fill: #79c0ff; }
      .g1 .dot { fill: #4493f8; }
      .g2 .box { fill: #2a2111; stroke: #d29922; }
      .g2 .tag { fill: #e3b341; }
      .g2 .dot { fill: #d29922; }
      .g3 .box { fill: #12261e; stroke: #3fb950; }
      .g3 .tag { fill: #56d364; }
      .g3 .dot { fill: #3fb950; }
    }
  </style>
  <defs>
    <marker id="gb-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="head" d="M0 0 10 5 0 10z"/>
    </marker>
  </defs>
  <rect class="band" x="30" y="20" width="840" height="184" rx="12"/>
  <text class="hd" x="54" y="56">Scripts</text>
  <text class="sub" x="54" y="78">Cheap and exact</text>
  <g class="g3" transform="translate(54 96)">
    <rect class="box" width="248" height="84" rx="10"/>
    <text class="ttl" x="18" y="36">Scan files</text>
    <text class="dsc" x="18" y="62">Everything in scope</text>
  </g>
  <path class="arw" d="M305 138H321" marker-end="url(#gb-head)"/>
  <g class="g3" transform="translate(326 96)">
    <rect class="box" width="248" height="84" rx="10"/>
    <text class="ttl" x="18" y="36">Group into batches</text>
    <text class="dsc" x="18" y="62">Sized for one analysis</text>
  </g>
  <path class="arw" d="M577 138H593" marker-end="url(#gb-head)"/>
  <g class="g3" transform="translate(598 96)">
    <rect class="box" width="248" height="84" rx="10"/>
    <text class="ttl" x="18" y="36">Extract structure</text>
    <text class="dsc" x="18" y="62">Exact, with tree-sitter</text>
  </g>
  <path class="arw" d="M450 208V254" marker-end="url(#gb-head)"/>
  <rect class="band" x="30" y="260" width="840" height="184" rx="12"/>
  <text class="hd" x="54" y="296">Agents</text>
  <text class="sub" x="54" y="318">Expensive and interpretive</text>
  <g class="g2" transform="translate(54 336)">
    <rect class="box" width="248" height="84" rx="10"/>
    <text class="ttl" x="18" y="36">Semantic analysis</text>
    <text class="dsc" x="18" y="62">Summaries, tags and edges</text>
  </g>
  <path class="arw" d="M305 378H321" marker-end="url(#gb-head)"/>
  <g class="g2" transform="translate(326 336)">
    <rect class="box" width="248" height="84" rx="10"/>
    <text class="ttl" x="18" y="36">Review and layers</text>
    <text class="dsc" x="18" y="62">Checked, then layered</text>
  </g>
  <path class="arw" d="M577 378H593" marker-end="url(#gb-head)"/>
  <g class="g2" transform="translate(598 336)">
    <rect class="box" width="248" height="84" rx="10"/>
    <text class="ttl" x="18" y="36">Tour design</text>
    <text class="dsc" x="18" y="62">A guided path through it</text>
  </g>
  <path class="arw" d="M450 448V484" marker-end="url(#gb-head)"/>
  <g class="g0" transform="translate(30 490)">
    <rect class="box" width="840" height="64" rx="10"/>
    <text class="ttl" x="24" y="40">Knowledge graph</text>
    <text class="dsc" x="230" y="40">Files, symbols, layers and tours in one file</text>
  </g>
</svg>
