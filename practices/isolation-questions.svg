<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 464" role="img" aria-labelledby="iso-title iso-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="iso-title">Two questions that decide agent isolation</title>
  <desc id="iso-desc">Two separate groups. The first asks where inference runs, which decides what data leaves your control. Its options are claude-local on your own machine, claude-bedrock in your AWS account, and claude-foundry in your Azure tenant. The second asks what the agent can reach, which decides what a mistake or an injected prompt can do. It holds claude-docker, with one repo, one branch and one dedicated key, followed by isolated-agent security, the guard rails the agent cannot relax. The questions are independent and most setups need both.</desc>
  <style>
    .box { stroke-width: 2; }
    .band { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .hd { font-size: 18px; font-weight: 700; fill: #1f2328; }
    .sub { font-size: 14px; fill: #59636e; }
    .ttl { font-size: 20px; font-weight: 700; fill: #1f2328; }
    .dsc { font-size: 15px; fill: #32383f; }
    .tag { font-size: 12.5px; font-weight: 700; letter-spacing: 1.2px; }
    .col { font-size: 12.5px; font-weight: 700; letter-spacing: 1.2px; fill: #6f7780; }
    .lbl { font-size: 14px; font-weight: 600; fill: #6f7780; }
    .mid { text-anchor: middle; }
    .arw { stroke: #6f7780; stroke-width: 2.5; fill: none; }
    .head { fill: #6f7780; }

    .g1 .box { fill: #ddf4ff; stroke: #0969da; }
    .g1 .tag { fill: #0550ae; }
    .g2 .box { fill: #fff8c5; stroke: #9a6700; }
    .g2 .tag { fill: #7d4e00; }
    .g3 .box { fill: #dafbe1; stroke: #1a7f37; }
    .g3 .tag { fill: #116329; }

    @media (prefers-color-scheme: dark) {
      .band { fill: #151b23; stroke: #3d444d; }
      .hd { fill: #f0f6fc; }
      .sub { fill: #9198a1; }
      .ttl { fill: #f0f6fc; }
      .dsc { fill: #d1d9e0; }
      .col { fill: #9198a1; }
      .lbl { fill: #9198a1; }
      .arw { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .g1 .box { fill: #121d2f; stroke: #4493f8; }
      .g1 .tag { fill: #79c0ff; }
      .g2 .box { fill: #2a2111; stroke: #d29922; }
      .g2 .tag { fill: #e3b341; }
      .g3 .box { fill: #12261e; stroke: #3fb950; }
      .g3 .tag { fill: #56d364; }
    }
  </style>
  <defs>
    <marker id="iso-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="head" d="M0 0 10 5 0 10z"/>
    </marker>
  </defs>
  <rect class="band" x="30" y="20" width="840" height="184" rx="12"/>
  <text class="hd" x="54" y="56">Where does inference run?</text>
  <text class="sub" x="54" y="78">Decides what data leaves your control</text>
  <g class="g1" transform="translate(54 96)">
    <rect class="box" width="248" height="84" rx="10"/>
    <text class="ttl" x="18" y="36">claude-local</text>
    <text class="dsc" x="18" y="62">Your own machine</text>
  </g>
  <g class="g1" transform="translate(326 96)">
    <rect class="box" width="248" height="84" rx="10"/>
    <text class="ttl" x="18" y="36">claude-bedrock</text>
    <text class="dsc" x="18" y="62">Your AWS account</text>
  </g>
  <g class="g1" transform="translate(598 96)">
    <rect class="box" width="248" height="84" rx="10"/>
    <text class="ttl" x="18" y="36">claude-foundry</text>
    <text class="dsc" x="18" y="62">Your Azure tenant</text>
  </g>
  <text class="lbl mid" x="450" y="237">Two separate questions. Most setups need both.</text>
  <rect class="band" x="30" y="260" width="840" height="184" rx="12"/>
  <text class="hd" x="54" y="296">What can the agent reach?</text>
  <text class="sub" x="54" y="318">Decides what a mistake, or an injected prompt, can do</text>
  <g class="g2" transform="translate(54 336)">
    <rect class="box" width="372" height="84" rx="10"/>
    <text class="ttl" x="18" y="36">claude-docker</text>
    <text class="dsc" x="18" y="62">One repo, one branch and one dedicated key</text>
  </g>
  <path class="arw" d="M430 378H468" marker-end="url(#iso-head)"/>
  <g class="g2" transform="translate(474 336)">
    <rect class="box" width="372" height="84" rx="10"/>
    <text class="ttl" x="18" y="36">Isolated-agent security</text>
    <text class="dsc" x="18" y="62">Guard rails the agent cannot relax</text>
  </g>
</svg>
