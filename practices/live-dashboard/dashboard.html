<title>Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: header + customer filter, status strip, customer tiles, then agenda (left) beside worklist / Monday (right); one column below 900px. */
:root{
  --bg:#F1F3F6; --panel:#FFFFFF; --ink:#18202B; --muted:#5B6676; --line:#DCE1E8;
  --accent:#2C55C9; --warn:#B4531A; --bad:#B42333; --ok:#1F7A4D; --yellow:#C99A06;
  --now:#E8EEFC; --hatch:rgba(120,128,140,.14);
  --c-acme:#A83266; --c-globex:#0D7A83; --c-initech:#A86B12; --c-partner:#2F5BD3; --c-own:#6A4FCF; --c-other:#7A828E;
  --f-sans:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F141A; --panel:#161D26; --ink:#E5E9EF; --muted:#94A0B0; --line:#263141;
  --accent:#86A6FF; --warn:#F09A5E; --bad:#FF7B88; --ok:#5BD08F; --yellow:#F2C744;
  --now:#1B2741; --hatch:rgba(160,170,185,.10);
  --c-acme:#F07AAE; --c-globex:#43C6CF; --c-initech:#E7B054; --c-partner:#86A6FF; --c-own:#AE9BFF; --c-other:#9AA3AF;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0F141A; --panel:#161D26; --ink:#E5E9EF; --muted:#94A0B0; --line:#263141;
  --accent:#86A6FF; --warn:#F09A5E; --bad:#FF7B88; --ok:#5BD08F; --yellow:#F2C744;
  --now:#1B2741; --hatch:rgba(160,170,185,.10);
  --c-acme:#F07AAE; --c-globex:#43C6CF; --c-initech:#E7B054; --c-partner:#86A6FF; --c-own:#AE9BFF; --c-other:#9AA3AF;
  color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-sans);padding-inline:16px;padding-block:20px 32px}
.wrap{max-width:1240px;margin:0 auto;display:grid;gap:14px}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

header.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px}
h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-.01em}
h1 small{font-weight:400;color:var(--muted);font-size:14px;margin-left:8px}
#syncState.warn{color:var(--warn)}
#syncState.err{color:var(--bad)}
.top .meta{display:flex;gap:12px;align-items:center;color:var(--muted);font-size:12px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 10px;cursor:pointer}
.btn:hover{border-color:var(--accent)}

.strip{display:grid;grid-template-columns:2fr 1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.strip > div{background:var(--panel);padding:12px 16px;min-width:0}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:500}
.big{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.big small{font-size:12px;font-weight:500;color:var(--bad);margin-left:6px}
.big .u{font-size:13px;font-weight:500;color:var(--muted);margin-left:4px}
.big .sep{color:var(--line);margin:0 8px;font-weight:400}
.strip.one{grid-template-columns:minmax(0,1fr)}
.nextup .title{font-size:16px;font-weight:600;margin-top:2px;overflow-wrap:anywhere}
.nextup .when{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.nextup .when b{color:var(--accent);font-weight:500}

.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:8px;padding:10px 12px;display:grid;gap:4px;min-width:0}
.tile:hover{border-color:var(--c)}
.tiles.single{grid-template-columns:minmax(0,1fr)}
.tiles.single .tile .nums{gap:4px 20px}
.tile[aria-pressed="true"]{outline:2px solid var(--c);outline-offset:-1px}
.tile:focus-visible{outline:2px solid var(--accent)}
.tile .nm{font-weight:600;display:flex;justify-content:space-between;gap:6px}
.tile .nm span{font-size:11px;color:var(--muted);font-weight:400}
.tile .nums{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tile .nums b{color:var(--ink);font-weight:600}
.tile .nums .hot b{color:var(--bad)}

.cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:start}
.stack{display:grid;gap:14px;min-width:0}
section.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0}
.ph{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.ph h2{font-size:14px;font-weight:600;margin:0}
.fresh{font-size:11px;color:var(--muted);font-family:var(--f-mono);padding:8px 16px 12px}

.note{margin:10px 16px;padding:8px 12px;border-radius:6px;font-size:12px;border:1px solid var(--line);background:var(--hatch)}
.note.err{border-color:var(--bad);color:var(--bad);background:transparent}
.note.warn{border-color:var(--warn);color:var(--warn);background:transparent}

.day{padding:4px 0 8px}
.dayh{display:flex;justify-content:space-between;gap:8px;padding:10px 16px 4px;font-size:12px;color:var(--muted)}
.dayh b{color:var(--ink);font-weight:600}
.ev{display:grid;grid-template-columns:96px 4px minmax(0,1fr);gap:10px;padding:6px 16px;align-items:start}
.ev .t{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:1px}
.ev .bar{align-self:stretch;border-radius:2px;background:var(--c);min-height:18px}
.ev .body{min-width:0}
.ev .name{font-weight:500;overflow-wrap:anywhere}
.ev .name a,.task a{text-decoration:none}
.ev .name a:hover,.task a:hover{text-decoration:underline}
.sub{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.cust{color:var(--c);font-weight:500}
.ev.past{opacity:.5}
.ev.live{background:var(--now)}
.ev.live .t{color:var(--accent)}
.ev.sample{background-image:repeating-linear-gradient(135deg,var(--hatch) 0 6px,transparent 6px 12px)}
.ev.sample .bar{background:repeating-linear-gradient(180deg,var(--c) 0 3px,transparent 3px 6px)}
.tag{font-size:10px;letter-spacing:.06em;text-transform:uppercase;border:1px solid currentColor;border-radius:3px;padding:0 4px;font-weight:600;white-space:nowrap}
.tag.sample{color:var(--warn)}
.tag.now{color:var(--accent)}
.tag.blocked{color:var(--bad)}
.tag.active{color:var(--ok)}
.tag.neutral{color:var(--muted)}
.empty{padding:2px 16px 4px 122px;font-size:12px;color:var(--muted)}
.blank{padding:16px;color:var(--muted);font-size:13px}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;padding:3px 10px;font-size:12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--panel)}

.grp{padding:8px 16px 2px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--c);font-weight:600;display:flex;justify-content:space-between}
.grp span{color:var(--muted);font-weight:500}
button.grp{all:unset;box-sizing:border-box;width:100%;cursor:pointer;padding:8px 16px 2px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--c);font-weight:600;display:flex;justify-content:space-between;gap:8px}
button.grp:hover .nm{text-decoration:underline}
button.grp:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
button.grp .nm{display:inline-flex;align-items:center;gap:6px;color:var(--c)}
button.grp .chev{display:inline-block;width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid currentColor;transition:transform .15s}
button.grp[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.wctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.more{all:unset;cursor:pointer;margin:2px 16px 6px 34px;font-size:12px;color:var(--accent)}
.more:hover{text-decoration:underline}
.more:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chk{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);cursor:pointer}
.task{display:grid;grid-template-columns:10px minmax(0,1fr);gap:8px;padding:5px 16px}
.task .pri{width:8px;height:8px;border-radius:50%;margin-top:6px;border:1px solid var(--muted)}
.task .pri.high{background:var(--bad);border-color:var(--bad)}
.task .pri.medium{background:var(--warn);border-color:var(--warn)}
.task .pri.low{background:transparent}
.task .ti{overflow-wrap:anywhere}
.task.done .ti{text-decoration:line-through;color:var(--muted)}
.key{font-family:var(--f-mono);font-size:11px;color:var(--muted)}

.ago{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.skel{height:14px;margin:12px 16px;border-radius:4px;background:var(--hatch)}

.rel{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:10px 16px;font-size:13px}
.rel .dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.rel .dot.ok{background:var(--ok)}
.rel .dot.warn{background:var(--warn)}
.rel .dot.bad{background:var(--bad)}
.rel .dot.yellow{background:var(--yellow)}
.rel b{font-weight:600}
.rel .meta{color:var(--muted);font-size:12px;font-family:var(--f-mono)}
.relgrid{border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 24px;padding:6px 16px 8px}
.relcell{display:flex;align-items:center;gap:8px;min-width:0;font-family:var(--f-mono);font-size:12px;padding:2px 0}
.relcell .ball{width:8px;height:8px;border-radius:50%;flex:none;background:var(--yellow)}
.relcell .ball.bad{background:var(--bad)}
.relcell .ball.busy{background:var(--accent)}
.relcell .rn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.relcell .ra{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.relcell .rx{color:var(--muted);font-family:var(--f-sans);font-size:10px;font-weight:600;letter-spacing:.06em;white-space:nowrap}
.relhint{padding:0 16px 8px;font-size:11px;color:var(--muted)}
@media (max-width:380px){.relgrid{grid-template-columns:minmax(0,1fr)}}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{all:unset;cursor:pointer;padding:8px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:4px}
.tab .n{font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--muted);margin-left:6px}

@media (max-width:1000px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:620px){
  .strip{grid-template-columns:1fr 1fr}.strip .nextup{grid-column:1/-1}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ev{grid-template-columns:72px 4px minmax(0,1fr)}.empty{padding-left:98px}
}
</style>

<div class="wrap">
  <header class="top">
    <h1>Dashboard <small id="today"></small></h1>
    <div class="meta"><span id="liveState">Connecting…</span><span id="syncState"></span><button class="btn" id="refresh" type="button" title="Re-fetch the live calendars, Monday and GitHub now, and start the Mac sync for Dashboard.md, the calendar feeds and Jira, and re-runs the release check">Refresh all</button></div>
  </header>

  <div class="strip" aria-live="polite">
    <div class="nextup"><div class="label" id="nextLabel">Next up</div><div class="title" id="nextTitle">—</div><div class="when" id="nextWhen"></div></div>
    <div><div class="label">Work</div><div class="big" id="workSum">—</div></div>
    <div id="srcCard"><div class="label" id="srcLabel">Release</div><div class="big" id="srcSum">—</div></div>
  </div>

  <div class="tiles" id="tiles" role="group" aria-label="Filter by customer"></div>

  <div class="tabs" role="tablist" aria-label="Views">
    <button type="button" class="tab" role="tab" id="tabWork" aria-controls="viewWork" aria-selected="true">Worklist<span class="n" id="nWork"></span></button>
    <button type="button" class="tab" role="tab" id="tabAgenda" aria-controls="viewAgenda" aria-selected="false" tabindex="-1">Next 7 days<span class="n" id="nAgenda"></span></button>
    <button type="button" class="tab" role="tab" id="tabMonday" aria-controls="viewMonday" aria-selected="false" tabindex="-1"><span class="lbl">Globex</span><span class="n" id="nMonday"></span></button>
    <button type="button" class="tab" role="tab" id="tabRelease" aria-controls="viewRelease" aria-selected="false" tabindex="-1" hidden><span class="lbl">Release</span><span class="n" id="nRelease"></span></button>
    <button type="button" class="tab" role="tab" id="tabJira" aria-controls="viewJira" aria-selected="false" tabindex="-1"><span class="lbl">Acme</span><span class="n" id="nJira"></span></button>
    <button type="button" class="tab" role="tab" id="tabGithub" aria-controls="viewGithub" aria-selected="false" tabindex="-1"><span class="lbl">Initech</span><span class="n" id="nGithub"></span></button>
  </div>

  <div id="viewWork" role="tabpanel" aria-labelledby="tabWork">
      <section class="panel" aria-labelledby="workH">
        <div class="ph">
          <h2 id="workH">Worklist</h2>
          <div class="wctl">
            <label class="chk" for="showDone"><input type="checkbox" id="showDone"> Show done</label>
            <div class="seg" role="group" aria-label="Worklist range">
              <button type="button" id="bToday" aria-pressed="true">Today</button>
              <button type="button" id="bTomorrow" aria-pressed="false">Tomorrow</button>
              <button type="button" id="bBacklog" aria-pressed="false">Backlog</button>
            </div>
          </div>
        </div>
        <div id="workNotes"></div>
        <div id="work"><div class="skel"></div><div class="skel"></div></div>
        <div class="fresh" id="workFresh"></div>
      </section>
  </div>

  <div id="viewJira" role="tabpanel" aria-labelledby="tabJira" hidden>
    <section class="panel" aria-labelledby="jiraH">
      <div class="ph"><h2 id="jiraH">Acme · Jira, assigned to me</h2><span class="sub" id="jiraCount"></span></div>
      <div id="jiraNotes"></div>
      <div id="jira"><div class="skel"></div></div>
      <div class="fresh" id="jiraFresh"></div>
    </section>
  </div>

  <div id="viewGithub" role="tabpanel" aria-labelledby="tabGithub" hidden>
    <section class="panel" aria-labelledby="ghH">
      <div class="ph"><h2 id="ghH">Initech · GitHub issues</h2>
        <div class="seg" role="group" aria-label="Initech issue filter">
          <button type="button" id="ghMine" aria-pressed="false">Assigned to me</button>
          <button type="button" id="ghAll" aria-pressed="true">All open</button>
        </div>
      </div>
      <div id="ghNotes"></div>
      <div id="gh"><div class="skel"></div></div>
      <div class="fresh" id="ghFresh"></div>
    </section>
  </div>

  <div id="viewRelease" role="tabpanel" aria-labelledby="tabRelease" hidden></div>

  <div id="viewMonday" role="tabpanel" aria-labelledby="tabMonday" hidden>
    <section class="panel" id="relPanel" aria-label="Globex release status" style="margin-bottom:14px">
      <div class="rel" id="relHead"><span class="dot"></span><b>Release status</b><span class="meta">checking…</span></div>
      <div id="relBody"></div>
    </section>
      <section class="panel" id="mondayPanel" aria-labelledby="mondayH">
        <div class="ph"><h2 id="mondayH">Globex · Tech board, mine</h2><span class="sub" id="mondayCount"></span></div>
        <div id="mondayNotes"></div>
        <div id="monday"><div class="skel"></div></div>
        <div class="fresh" id="mondayFresh"></div>
      </section>
  </div>

  <div id="viewAgenda" role="tabpanel" aria-labelledby="tabAgenda" hidden>
  <section class="panel" aria-labelledby="agendaH">
    <div class="ph"><h2 id="agendaH">Next 7 days</h2><span class="sub" id="agendaScope"></span></div>
    <div id="calNotes"></div>
    <div id="agenda"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
  </section>
  </div>
</div>

<script>
(() => {
  const LON = "Europe/London";
  const CUST = {
    acme: { name: "Acme", kw: /\b(acme)\b/i },       // EDIT: client names and words that mark its meetings
    globex: { name: "Globex", kw: /\b(globex)\b/i },
    initech: { name: "Initech", kw: /\b(initech)\b/i },
    partner: { name: "Partner", kw: null },
    own: { name: "My Company", kw: null },
    other: { name: "Other", kw: null }
  };
  const ORDER = ["acme", "globex", "initech", "partner", "own"];
  const colorOf = c => `var(--c-${CUST[c] ? c : "other"})`;
  const SYNC_TRIGGER = "trig_REPLACE_ME"; // EDIT: id of your "Dashboard sync" scheduled task
  const SYNC_TIMEOUT = 6 * 60000;
  const MONDAY_BOARD = 0, MONDAY_ME = "person-0"; // EDIT: board id and your monday.com person id
  const S = {
    cal: { nb: null, lk: null }, calErr: { nb: null, lk: null }, calAt: { nb: null, lk: null },
    monday: null, mondayMore: false, mondayErr: null, mondayAt: null,
    tasks: null, tasksMeta: null, tasksErr: null, jira: null, rel: null, relErr: null, relCached: null, gh: null, ghErr: null, ghAt: null, ghMe: null, ghMine: false,
    feeds: null, feedsMeta: null,
    focus: "all", band: "today",
    dayKey: null, mcp: undefined, db: undefined
  };
  const load = (k, ok) => { try { const v = localStorage.getItem(k); return ok(v) ? v : null; } catch (e) { return null; } };
  const save = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  S.focus = load("db.focus", v => v === "all" || ORDER.includes(v)) || "all";
  S.band = load("db.band", v => ["today", "tomorrow", "backlog"].includes(v)) || "today";
  S.showDone = load("db.showDone", v => v === "1" || v === "0") === "1";
  S.collapsed = new Set();
  S.ghMine = load("db.ghMine", v => v === "1" || v === "0") === "1";
  const loadSet = k => { const st = new Set(); try { JSON.parse(localStorage.getItem(k) || "null")?.forEach(x => st.add(x)); } catch (e) {} return st; };
  const hasSaved = k => { try { return localStorage.getItem(k) !== null; } catch (e) { return false; } };
  S.jCollapsed = hasSaved("db.jCollapsed") ? loadSet("db.jCollapsed") : new Set(["cat:new"]);
  S.gCollapsed = loadSet("db.gCollapsed");
  const hashView = (location.hash || "").replace("#", "");
  const VIEWS = [{ id: "worklist", tab: "tabWork", panel: "viewWork" }, { id: "agenda", tab: "tabAgenda", panel: "viewAgenda" }, { id: "globex", tab: "tabMonday", panel: "viewMonday", client: "globex", label: ["Globex", "Monday"] },
    { id: "release", tab: "tabRelease", panel: "viewRelease", client: "globex", focusOnly: true, label: ["Release", "Release"] }, { id: "acme", tab: "tabJira", panel: "viewJira", client: "acme", label: ["Acme", "Jira"] }, { id: "initech", tab: "tabGithub", panel: "viewGithub", client: "initech", label: ["Initech", "GitHub"] }];
  const isView = v => VIEWS.some(x => x.id === v);
  const ALIAS = { jira: "acme", monday: "globex", github: "initech" };
  const savedView = load("db.view", v => isView(v) || v in ALIAS);
  S.view = isView(hashView) ? hashView : ALIAS[hashView] || (savedView && (ALIAS[savedView] || savedView)) || "worklist";
  S.expanded = new Set(); // customers showing their full list (this page load only)
  const CAP = 5;
  try { JSON.parse(localStorage.getItem("db.collapsed") || "[]").forEach(c => S.collapsed.add(c)); } catch (e) {}

  // ---------- helpers ----------
  const $ = id => document.getElementById(id);
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v; else el.setAttribute(k, v);
    }
    for (const k of kids.flat()) if (k != null && k !== false) el.append(k.nodeType ? k : document.createTextNode(String(k)));
    return el;
  }
  const safeUrl = u => (typeof u === "string" && /^https:\/\//i.test(u)) ? u : null;
  const linkOr = (url, text) => url ? h("a", { href: url, target: "_blank", rel: "noopener" }, text) : text;
  const startOfDay = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;

    // Start the Mac sync once; while one is running, a second click only refreshes the live sources.
    if (!(S.sync && S.sync.pending && Date.now() - S.sync.pending < SYNC_TIMEOUT)) {
      S.sync = { pending: Date.now() }; renderSyncState();
      try {
        await S.mcp.callTool("Claude Code Remote", "fire_trigger", { trigger_id: SYNC_TRIGGER }, { cache: false });
      } catch (err) {
        // A failed start is not proof nothing ran, so no automatic retry; the next click tries again.
        S.sync = { error: err && err.code === "tool_error" ? (err.message || "the scheduled task refused") : errCopy(err, "Claude Code Remote") };
      }
      renderSyncState();
    }
    setTimeout(() => { b.disabled = false; b.textContent = "Refresh all"; }, 1500);
  });
  setInterval(() => { if (S.mcp && S.dayKey !== ymd(new Date())) register(); renderAll(); }, 30000);

  renderAll();
  const use = name => (window.claude && window.claude.use ? window.claude.use(name) : Promise.resolve(null)).catch(() => null);
  use("db").then(db => { S.db = db; if (db) subscribeStore(db); renderAll(); });
  use("mcp").then(mcp => {
    S.mcp = mcp;
    if (!mcp) { S.cal.nb = []; S.cal.lk = []; const e = { code: "not_granted" }; S.calErr.nb = S.calErr.lk = S.mondayErr = S.ghErr = e; }
    else register();
    renderAll();
  });
})();
</script>
