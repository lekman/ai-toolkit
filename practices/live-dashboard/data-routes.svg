<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 468" role="img" aria-labelledby="dr-title dr-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="dr-title">How data reaches the dashboard page</title>
  <desc id="dr-desc">Three routes to the dashboard page. Live connectors run in the page code every few minutes and read calendars, boards and issues. A scheduled sync on your computer sends notes, calendar feeds and tracker tickets to the artifact data store, which the page reads. The page also saves its last result back to that store. A local MCP server answers on request, for the release check and for sync now.</desc>
  <style>
    .box { stroke-width: 2; }
    .band { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .hd { font-size: 18px; font-weight: 700; fill: #1f2328; }
    .sub { font-size: 14px; fill: #59636e; }
    .ttl { font-size: 20px; font-weight: 700; fill: #1f2328; }
    .dsc { font-size: 15px; fill: #32383f; }
    .tag { font-size: 12.5px; font-weight: 700; letter-spacing: 1.2px; }
    .num { font-size: 14px; font-weight: 700; text-anchor: middle; fill: #ffffff; }
    .lbl { font-size: 14px; font-weight: 600; fill: #6f7780; }
    .mid { text-anchor: middle; }
    .arw { stroke: #6f7780; stroke-width: 2.5; fill: none; }
    .opt { stroke-dasharray: 7 5; }
    .head { fill: #6f7780; }

    .g0 .box { fill: #f6f8fa; stroke: #8c959f; }
    .g0 .tag { fill: #59636e; }
    .g1 .box { fill: #ddf4ff; stroke: #0969da; }
    .g1 .tag { fill: #0550ae; }
    .g1 .dot { fill: #0969da; }
    .g2 .box { fill: #fff8c5; stroke: #9a6700; }
    .g2 .tag { fill: #7d4e00; }
    .g2 .dot { fill: #9a6700; }
    .g3 .box { fill: #dafbe1; stroke: #1a7f37; }
    .g3 .tag { fill: #116329; }
    .g3 .dot { fill: #1a7f37; }

    @media (prefers-color-scheme: dark) {
      .band { fill: #151b23; stroke: #3d444d; }
      .hd { fill: #f0f6fc; }
      .sub { fill: #9198a1; }
      .ttl { fill: #f0f6fc; }
      .dsc { fill: #d1d9e0; }
      .num { fill: #0d1117; }
      .lbl { fill: #9198a1; }
      .arw { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .g0 .box { fill: #151b23; stroke: #656d76; }
      .g0 .tag { fill: #9198a1; }
      .g1 .box { fill: #121d2f; stroke: #4493f8; }
      .g1 .tag { fill: #79c0ff; }
      .g1 .dot { fill: #4493f8; }
      .g2 .box { fill: #2a2111; stroke: #d29922; }
      .g2 .tag { fill: #e3b341; }
      .g2 .dot { fill: #d29922; }
      .g3 .box { fill: #12261e; stroke: #3fb950; }
      .g3 .tag { fill: #56d364; }
      .g3 .dot { fill: #3fb950; }
    }
  </style>
  <defs>
    <marker id="dr-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="head" d="M0 0 10 5 0 10z"/>
    </marker>
  </defs>
  <g class="g1" transform="translate(30 24)">
    <rect class="box" width="250" height="124" rx="10"/>
    <text class="tag" x="18" y="32">LIVE CONNECTORS</text>
    <text class="ttl" x="18" y="68">Page code</text>
    <text class="dsc" x="18" y="91">Calendars, boards and</text>
    <text class="dsc" x="18" y="110">issues, every few minutes</text>
  </g>
  <g class="g2" transform="translate(30 172)">
    <rect class="box" width="250" height="124" rx="10"/>
    <text class="tag" x="18" y="32">SCHEDULED SYNC</text>
    <text class="ttl" x="18" y="68">Your computer</text>
    <text class="dsc" x="18" y="91">Notes, calendar feeds</text>
    <text class="dsc" x="18" y="110">and tracker tickets</text>
  </g>
  <path class="arw" d="M284 234H319" marker-end="url(#dr-head)"/>
  <g class="g2" transform="translate(325 172)">
    <rect class="box" width="250" height="124" rx="10"/>
    <text class="tag" x="18" y="32">STORE</text>
    <text class="ttl" x="18" y="68">Artifact data</text>
    <text class="dsc" x="18" y="91">Synced data and the</text>
    <text class="dsc" x="18" y="110">page's last result</text>
  </g>
  <g class="g3" transform="translate(30 320)">
    <rect class="box" width="250" height="124" rx="10"/>
    <text class="tag" x="18" y="32">LOCAL MCP SERVER</text>
    <text class="ttl" x="18" y="68">On request</text>
    <text class="dsc" x="18" y="91">Release check</text>
    <text class="dsc" x="18" y="110">and sync now</text>
  </g>
  <path class="arw" d="M284 86H596V190H614" marker-end="url(#dr-head)"/>
  <path class="arw" d="M579 220H614" marker-end="url(#dr-head)"/>
  <path class="arw opt" d="M616 248H581" marker-end="url(#dr-head)"/>
  <path class="arw" d="M284 382H596V280H614" marker-end="url(#dr-head)"/>
  <g class="g0" transform="translate(620 172)">
    <rect class="box" width="250" height="124" rx="10"/>
    <text class="tag" x="18" y="32">RESULT</text>
    <text class="ttl" x="18" y="68">Dashboard page</text>
    <text class="dsc" x="18" y="91">Refreshes with no</text>
    <text class="dsc" x="18" y="110">AI run in the loop</text>
  </g>
</svg>
