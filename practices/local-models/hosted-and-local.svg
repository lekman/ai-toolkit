<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 342" role="img" aria-labelledby="hl-title hl-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="hl-title">The hosted and the local path side by side</title>
  <desc id="hl-desc">Two rows compared across three columns: command, endpoint and model. The hosted row: the claude command is unchanged and sets no variables, it talks to the Anthropic API over the internet, and the model is hosted Claude, which is strongest on long, multi-step work. The local row: the claude-local command sets the endpoint for its one process, it talks to LM Studio, which serves the same Messages API on your own machine, and the model is local, so nothing leaves the laptop.</desc>
  <style>
    .box { stroke-width: 2; }
    .band { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .hd { font-size: 18px; font-weight: 700; fill: #1f2328; }
    .sub { font-size: 14px; fill: #59636e; }
    .ttl { font-size: 20px; font-weight: 700; fill: #1f2328; }
    .dsc { font-size: 15px; fill: #32383f; }
    .tag { font-size: 12.5px; font-weight: 700; letter-spacing: 1.2px; }
    .num { font-size: 14px; font-weight: 700; text-anchor: middle; fill: #ffffff; }
    .lbl { font-size: 14px; font-weight: 600; fill: #6f7780; }
    .mid { text-anchor: middle; }
    .arw { stroke: #6f7780; stroke-width: 2.5; fill: none; }
    .opt { stroke-dasharray: 7 5; }
    .head { fill: #6f7780; }

    .g0 .box { fill: #f6f8fa; stroke: #8c959f; }
    .g0 .tag { fill: #59636e; }
    .g1 .box { fill: #ddf4ff; stroke: #0969da; }
    .g1 .tag { fill: #0550ae; }
    .g1 .dot { fill: #0969da; }
    .g2 .box { fill: #fff8c5; stroke: #9a6700; }
    .g2 .tag { fill: #7d4e00; }
    .g2 .dot { fill: #9a6700; }
    .g3 .box { fill: #dafbe1; stroke: #1a7f37; }
    .g3 .tag { fill: #116329; }
    .g3 .dot { fill: #1a7f37; }

    @media (prefers-color-scheme: dark) {
      .band { fill: #151b23; stroke: #3d444d; }
      .hd { fill: #f0f6fc; }
      .sub { fill: #9198a1; }
      .ttl { fill: #f0f6fc; }
      .dsc { fill: #d1d9e0; }
      .num { fill: #0d1117; }
      .lbl { fill: #9198a1; }
      .arw { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .g0 .box { fill: #151b23; stroke: #656d76; }
      .g0 .tag { fill: #9198a1; }
      .g1 .box { fill: #121d2f; stroke: #4493f8; }
      .g1 .tag { fill: #79c0ff; }
      .g1 .dot { fill: #4493f8; }
      .g2 .box { fill: #2a2111; stroke: #d29922; }
      .g2 .tag { fill: #e3b341; }
      .g2 .dot { fill: #d29922; }
      .g3 .box { fill: #12261e; stroke: #3fb950; }
      .g3 .tag { fill: #56d364; }
      .g3 .dot { fill: #3fb950; }
    }
  </style>
  <defs>
    <marker id="hl-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="head" d="M0 0 10 5 0 10z"/>
    </marker>
  </defs>
  <text class="lbl" x="30" y="30" style="letter-spacing:1.2px;font-size:12.5px;font-weight:700">COMMAND</text>
  <text class="lbl" x="325" y="30" style="letter-spacing:1.2px;font-size:12.5px;font-weight:700">ENDPOINT</text>
  <text class="lbl" x="620" y="30" style="letter-spacing:1.2px;font-size:12.5px;font-weight:700">MODEL</text>
  <g class="g1" transform="translate(30 46)">
    <rect class="box" width="250" height="124" rx="10"/>
    <text class="tag" x="18" y="32">HOSTED</text>
    <text class="ttl" x="18" y="68">claude</text>
    <text class="dsc" x="18" y="91">Unchanged, with no</text>
    <text class="dsc" x="18" y="110">variables set</text>
  </g>
  <path class="arw" d="M284 108H319" marker-end="url(#hl-head)"/>
  <g class="g1" transform="translate(325 46)">
    <rect class="box" width="250" height="124" rx="10"/>
    <text class="tag" x="18" y="32">HOSTED</text>
    <text class="ttl" x="18" y="68">Anthropic API</text>
    <text class="dsc" x="18" y="91">The Messages API,</text>
    <text class="dsc" x="18" y="110">over the internet</text>
  </g>
  <path class="arw" d="M579 108H614" marker-end="url(#hl-head)"/>
  <g class="g1" transform="translate(620 46)">
    <rect class="box" width="250" height="124" rx="10"/>
    <text class="tag" x="18" y="32">HOSTED</text>
    <text class="ttl" x="18" y="68">Hosted Claude</text>
    <text class="dsc" x="18" y="91">Strongest on long,</text>
    <text class="dsc" x="18" y="110">multi-step work</text>
  </g>
  <g class="g3" transform="translate(30 194)">
    <rect class="box" width="250" height="124" rx="10"/>
    <text class="tag" x="18" y="32">LOCAL</text>
    <text class="ttl" x="18" y="68">claude-local</text>
    <text class="dsc" x="18" y="91">Sets the endpoint for</text>
    <text class="dsc" x="18" y="110">this one process</text>
  </g>
  <path class="arw" d="M284 256H319" marker-end="url(#hl-head)"/>
  <g class="g3" transform="translate(325 194)">
    <rect class="box" width="250" height="124" rx="10"/>
    <text class="tag" x="18" y="32">LOCAL</text>
    <text class="ttl" x="18" y="68">LM Studio</text>
    <text class="dsc" x="18" y="91">The same Messages API,</text>
    <text class="dsc" x="18" y="110">on your own machine</text>
  </g>
  <path class="arw" d="M579 256H614" marker-end="url(#hl-head)"/>
  <g class="g3" transform="translate(620 194)">
    <rect class="box" width="250" height="124" rx="10"/>
    <text class="tag" x="18" y="32">LOCAL</text>
    <text class="ttl" x="18" y="68">Local model</text>
    <text class="dsc" x="18" y="91">Nothing leaves</text>
    <text class="dsc" x="18" y="110">the laptop</text>
  </g>
</svg>
