<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 228" role="img" aria-labelledby="mb-title mb-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="mb-title">How 48 GB of memory is divided</title>
  <desc id="mb-desc">One bar drawn to scale for 48 GB of unified memory. About 24 GB holds the model and its context, for a 4-bit 30B model with a 64k context. About 12 GB more is free under the GPU memory cap. The cap sits at about 36 GB, which is 75 percent of the total. The last 12 GB is outside the cap and is kept for macOS.</desc>
  <style>
    .box { stroke-width: 2; }
    .band { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .hd { font-size: 18px; font-weight: 700; fill: #1f2328; }
    .sub { font-size: 14px; fill: #59636e; }
    .ttl { font-size: 20px; font-weight: 700; fill: #1f2328; }
    .dsc { font-size: 15px; fill: #32383f; }
    .tag { font-size: 12.5px; font-weight: 700; letter-spacing: 1.2px; }
    .num { font-size: 14px; font-weight: 700; text-anchor: middle; fill: #ffffff; }
    .lbl { font-size: 14px; font-weight: 600; fill: #6f7780; }
    .mid { text-anchor: middle; }
    .arw { stroke: #6f7780; stroke-width: 2.5; fill: none; }
    .opt { stroke-dasharray: 7 5; }
    .head { fill: #6f7780; }

    .g0 .box { fill: #f6f8fa; stroke: #8c959f; }
    .g0 .tag { fill: #59636e; }
    .g1 .box { fill: #ddf4ff; stroke: #0969da; }
    .g1 .tag { fill: #0550ae; }
    .g1 .dot { fill: #0969da; }
    .g2 .box { fill: #fff8c5; stroke: #9a6700; }
    .g2 .tag { fill: #7d4e00; }
    .g2 .dot { fill: #9a6700; }
    .g3 .box { fill: #dafbe1; stroke: #1a7f37; }
    .g3 .tag { fill: #116329; }
    .g3 .dot { fill: #1a7f37; }

    @media (prefers-color-scheme: dark) {
      .band { fill: #151b23; stroke: #3d444d; }
      .hd { fill: #f0f6fc; }
      .sub { fill: #9198a1; }
      .ttl { fill: #f0f6fc; }
      .dsc { fill: #d1d9e0; }
      .num { fill: #0d1117; }
      .lbl { fill: #9198a1; }
      .arw { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .g0 .box { fill: #151b23; stroke: #656d76; }
      .g0 .tag { fill: #9198a1; }
      .g1 .box { fill: #121d2f; stroke: #4493f8; }
      .g1 .tag { fill: #79c0ff; }
      .g1 .dot { fill: #4493f8; }
      .g2 .box { fill: #2a2111; stroke: #d29922; }
      .g2 .tag { fill: #e3b341; }
      .g2 .dot { fill: #d29922; }
      .g3 .box { fill: #12261e; stroke: #3fb950; }
      .g3 .tag { fill: #56d364; }
      .g3 .dot { fill: #3fb950; }
    }
  </style>
  <defs>
    <marker id="mb-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="head" d="M0 0 10 5 0 10z"/>
    </marker>
  </defs>
  <text class="lbl" x="30" y="38">48 GB of unified memory</text>
  <text class="lbl" x="654" y="38" text-anchor="end">GPU memory cap, about 75%</text>
  <g class="g1" transform="translate(30 56)">
    <rect class="box" width="417" height="124" rx="10"/>
    <text class="tag" x="18" y="32">MODEL AND CONTEXT</text>
    <text class="ttl" x="18" y="68">About 24 GB</text>
    <text class="dsc" x="18" y="91">A 4-bit 30B model with a 64k context</text>
  </g>
  <g class="g3" transform="translate(453 56)">
    <rect class="box" width="204" height="124" rx="10"/>
    <text class="tag" x="18" y="32">FREE UNDER THE CAP</text>
    <text class="ttl" x="18" y="68">About 12 GB</text>
    <text class="dsc" x="18" y="91">Room to spare</text>
  </g>
  <g class="g0" transform="translate(663 56)">
    <rect class="box" width="207" height="124" rx="10"/>
    <text class="tag" x="18" y="32">OUTSIDE THE CAP</text>
    <text class="ttl" x="18" y="68">About 12 GB</text>
    <text class="dsc" x="18" y="91">Kept for macOS</text>
  </g>
  <path class="arw opt" d="M660 46V190"/>
  <text class="lbl" x="30" y="210" text-anchor="start">0</text>
  <text class="lbl" x="660" y="210" text-anchor="middle">36 GB</text>
  <text class="lbl" x="870" y="210" text-anchor="end">48 GB</text>
</svg>
