<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 432" role="img" aria-labelledby="wu-title wu-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="wu-title">When to use the local model and when the hosted one</title>
  <desc id="wu-desc">Two groups. Reach for the local model for private code that may not leave the machine, for offline work with no network, for cheap loops where nothing is metered, and for testing whether a prompt or skill needs a strong model. Stay on the hosted model for long tasks with many steps, for one change threaded through many files, for loops that the hosted model finishes in a minute and a local one in ten, and when on battery, which local inference drains fast.</desc>
  <style>
    .box { stroke-width: 2; }
    .band { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .hd { font-size: 18px; font-weight: 700; fill: #1f2328; }
    .sub { font-size: 14px; fill: #59636e; }
    .ttl { font-size: 20px; font-weight: 700; fill: #1f2328; }
    .dsc { font-size: 15px; fill: #32383f; }
    .tag { font-size: 12.5px; font-weight: 700; letter-spacing: 1.2px; }
    .num { font-size: 14px; font-weight: 700; text-anchor: middle; fill: #ffffff; }
    .lbl { font-size: 14px; font-weight: 600; fill: #6f7780; }
    .mid { text-anchor: middle; }
    .arw { stroke: #6f7780; stroke-width: 2.5; fill: none; }
    .opt { stroke-dasharray: 7 5; }
    .head { fill: #6f7780; }

    .g0 .box { fill: #f6f8fa; stroke: #8c959f; }
    .g0 .tag { fill: #59636e; }
    .g1 .box { fill: #ddf4ff; stroke: #0969da; }
    .g1 .tag { fill: #0550ae; }
    .g1 .dot { fill: #0969da; }
    .g2 .box { fill: #fff8c5; stroke: #9a6700; }
    .g2 .tag { fill: #7d4e00; }
    .g2 .dot { fill: #9a6700; }
    .g3 .box { fill: #dafbe1; stroke: #1a7f37; }
    .g3 .tag { fill: #116329; }
    .g3 .dot { fill: #1a7f37; }

    @media (prefers-color-scheme: dark) {
      .band { fill: #151b23; stroke: #3d444d; }
      .hd { fill: #f0f6fc; }
      .sub { fill: #9198a1; }
      .ttl { fill: #f0f6fc; }
      .dsc { fill: #d1d9e0; }
      .num { fill: #0d1117; }
      .lbl { fill: #9198a1; }
      .arw { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .g0 .box { fill: #151b23; stroke: #656d76; }
      .g0 .tag { fill: #9198a1; }
      .g1 .box { fill: #121d2f; stroke: #4493f8; }
      .g1 .tag { fill: #79c0ff; }
      .g1 .dot { fill: #4493f8; }
      .g2 .box { fill: #2a2111; stroke: #d29922; }
      .g2 .tag { fill: #e3b341; }
      .g2 .dot { fill: #d29922; }
      .g3 .box { fill: #12261e; stroke: #3fb950; }
      .g3 .tag { fill: #56d364; }
      .g3 .dot { fill: #3fb950; }
    }
  </style>
  <defs>
    <marker id="wu-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="head" d="M0 0 10 5 0 10z"/>
    </marker>
  </defs>
  <rect class="band" x="30" y="20" width="840" height="184" rx="12"/>
  <text class="hd" x="54" y="56">Reach for the local model</text>
  <text class="sub" x="54" y="78">The trade in capability is worth it here</text>
  <g class="g3" transform="translate(54 96)">
    <rect class="box" width="174" height="84" rx="10"/>
    <text class="ttl" x="18" y="36">Private code</text>
    <text class="dsc" x="18" y="62">It may not leave</text>
  </g>
  <g class="g3" transform="translate(260 96)">
    <rect class="box" width="174" height="84" rx="10"/>
    <text class="ttl" x="18" y="36">Offline work</text>
    <text class="dsc" x="18" y="62">No network needed</text>
  </g>
  <g class="g3" transform="translate(466 96)">
    <rect class="box" width="174" height="84" rx="10"/>
    <text class="ttl" x="18" y="36">Cheap loops</text>
    <text class="dsc" x="18" y="62">Nothing is metered</text>
  </g>
  <g class="g3" transform="translate(672 96)">
    <rect class="box" width="174" height="84" rx="10"/>
    <text class="ttl" x="18" y="36">Prompt tests</text>
    <text class="dsc" x="18" y="62">Is strength needed?</text>
  </g>
  <rect class="band" x="30" y="228" width="840" height="184" rx="12"/>
  <text class="hd" x="54" y="264">Stay on the hosted model</text>
  <text class="sub" x="54" y="286">A local 30B model falls behind here</text>
  <g class="g1" transform="translate(54 304)">
    <rect class="box" width="174" height="84" rx="10"/>
    <text class="ttl" x="18" y="36">Long tasks</text>
    <text class="dsc" x="18" y="62">Many steps in a row</text>
  </g>
  <g class="g1" transform="translate(260 304)">
    <rect class="box" width="174" height="84" rx="10"/>
    <text class="ttl" x="18" y="36">Many files</text>
    <text class="dsc" x="18" y="62">A change across six</text>
  </g>
  <g class="g1" transform="translate(466 304)">
    <rect class="box" width="174" height="84" rx="10"/>
    <text class="ttl" x="18" y="36">Agent loops</text>
    <text class="dsc" x="18" y="62">Slower on local</text>
  </g>
  <g class="g1" transform="translate(672 304)">
    <rect class="box" width="174" height="84" rx="10"/>
    <text class="ttl" x="18" y="36">On battery</text>
    <text class="dsc" x="18" y="62">Local drains it</text>
  </g>
</svg>
