<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 342" role="img" aria-labelledby="cmp-title cmp-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="cmp-title">Two layers, for prose and for code</title>
  <desc id="cmp-desc">Two rows compared across three columns: source, layer and the question it answers. For prose, notes, docs and decisions feed a RAG index that is semantic and spans many sources, and it answers where something was discussed and what was decided. For code, one repository feeds a codebase graph that is structural and covers that repository, and it answers what calls something and what breaks if it changes.</desc>
  <style>
    .box { stroke-width: 2; }
    .band { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .hd { font-size: 18px; font-weight: 700; fill: #1f2328; }
    .sub { font-size: 14px; fill: #59636e; }
    .ttl { font-size: 20px; font-weight: 700; fill: #1f2328; }
    .dsc { font-size: 15px; fill: #32383f; }
    .tag { font-size: 12.5px; font-weight: 700; letter-spacing: 1.2px; }
    .col { font-size: 12.5px; font-weight: 700; letter-spacing: 1.2px; fill: #6f7780; }
    .lbl { font-size: 14px; font-weight: 600; fill: #6f7780; }
    .mid { text-anchor: middle; }
    .arw { stroke: #6f7780; stroke-width: 2.5; fill: none; }
    .head { fill: #6f7780; }

    .g1 .box { fill: #ddf4ff; stroke: #0969da; }
    .g1 .tag { fill: #0550ae; }
    .g2 .box { fill: #fff8c5; stroke: #9a6700; }
    .g2 .tag { fill: #7d4e00; }
    .g3 .box { fill: #dafbe1; stroke: #1a7f37; }
    .g3 .tag { fill: #116329; }

    @media (prefers-color-scheme: dark) {
      .band { fill: #151b23; stroke: #3d444d; }
      .hd { fill: #f0f6fc; }
      .sub { fill: #9198a1; }
      .ttl { fill: #f0f6fc; }
      .dsc { fill: #d1d9e0; }
      .col { fill: #9198a1; }
      .lbl { fill: #9198a1; }
      .arw { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .g1 .box { fill: #121d2f; stroke: #4493f8; }
      .g1 .tag { fill: #79c0ff; }
      .g2 .box { fill: #2a2111; stroke: #d29922; }
      .g2 .tag { fill: #e3b341; }
      .g3 .box { fill: #12261e; stroke: #3fb950; }
      .g3 .tag { fill: #56d364; }
    }
  </style>
  <defs>
    <marker id="cmp-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="head" d="M0 0 10 5 0 10z"/>
    </marker>
  </defs>
  <text class="col" x="30" y="30">SOURCE</text>
  <text class="col" x="325" y="30">LAYER</text>
  <text class="col" x="620" y="30">QUESTION IT ANSWERS</text>
  <g class="g1" transform="translate(30 46)">
    <rect class="box" width="250" height="124" rx="10"/>
    <text class="tag" x="18" y="32">PROSE</text>
    <text class="ttl" x="18" y="68">What was written</text>
    <text class="dsc" x="18" y="91">Notes, docs</text>
    <text class="dsc" x="18" y="110">and decisions</text>
  </g>
  <path class="arw" d="M284 108H319" marker-end="url(#cmp-head)"/>
  <g class="g1" transform="translate(325 46)">
    <rect class="box" width="250" height="124" rx="10"/>
    <text class="tag" x="18" y="32">PROSE</text>
    <text class="ttl" x="18" y="68">RAG index</text>
    <text class="dsc" x="18" y="91">Semantic, across</text>
    <text class="dsc" x="18" y="110">many sources</text>
  </g>
  <path class="arw" d="M579 108H614" marker-end="url(#cmp-head)"/>
  <g class="g1" transform="translate(620 46)">
    <rect class="box" width="250" height="124" rx="10"/>
    <text class="tag" x="18" y="32">PROSE</text>
    <text class="ttl" x="18" y="68">What was said?</text>
    <text class="dsc" x="18" y="91">Where was this discussed,</text>
    <text class="dsc" x="18" y="110">and what did we decide?</text>
  </g>
  <g class="g3" transform="translate(30 194)">
    <rect class="box" width="250" height="124" rx="10"/>
    <text class="tag" x="18" y="32">CODE</text>
    <text class="ttl" x="18" y="68">One repository</text>
    <text class="dsc" x="18" y="91">Files, symbols and</text>
    <text class="dsc" x="18" y="110">the links between them</text>
  </g>
  <path class="arw" d="M284 256H319" marker-end="url(#cmp-head)"/>
  <g class="g3" transform="translate(325 194)">
    <rect class="box" width="250" height="124" rx="10"/>
    <text class="tag" x="18" y="32">CODE</text>
    <text class="ttl" x="18" y="68">Codebase graph</text>
    <text class="dsc" x="18" y="91">Structural, for</text>
    <text class="dsc" x="18" y="110">one repository</text>
  </g>
  <path class="arw" d="M579 256H614" marker-end="url(#cmp-head)"/>
  <g class="g3" transform="translate(620 194)">
    <rect class="box" width="250" height="124" rx="10"/>
    <text class="tag" x="18" y="32">CODE</text>
    <text class="ttl" x="18" y="68">What connects?</text>
    <text class="dsc" x="18" y="91">What calls this, and what</text>
    <text class="dsc" x="18" y="110">breaks if I change it?</text>
  </g>
</svg>
