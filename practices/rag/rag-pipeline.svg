<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 464" role="img" aria-labelledby="rp-title rp-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="rp-title">How retrieval-augmented generation works</title>
  <desc id="rp-desc">Two groups. Ingestion runs ahead of time, when the sources change. Sources such as notes, docs and wikis are split into passages, each passage is embedded as a vector, and the vectors go into a search index with their metadata. Query runs just in time, for each question. The question is embedded the same way, the index returns the most similar chunks, and the answer is built from them.</desc>
  <style>
    .box { stroke-width: 2; }
    .band { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .hd { font-size: 18px; font-weight: 700; fill: #1f2328; }
    .sub { font-size: 14px; fill: #59636e; }
    .ttl { font-size: 20px; font-weight: 700; fill: #1f2328; }
    .dsc { font-size: 15px; fill: #32383f; }
    .tag { font-size: 12.5px; font-weight: 700; letter-spacing: 1.2px; }
    .num { font-size: 14px; font-weight: 700; text-anchor: middle; fill: #ffffff; }
    .lbl { font-size: 14px; font-weight: 600; fill: #6f7780; }
    .mid { text-anchor: middle; }
    .arw { stroke: #6f7780; stroke-width: 2.5; fill: none; }
    .opt { stroke-dasharray: 7 5; }
    .head { fill: #6f7780; }

    .g0 .box { fill: #f6f8fa; stroke: #8c959f; }
    .g0 .tag { fill: #59636e; }
    .g1 .box { fill: #ddf4ff; stroke: #0969da; }
    .g1 .tag { fill: #0550ae; }
    .g1 .dot { fill: #0969da; }
    .g2 .box { fill: #fff8c5; stroke: #9a6700; }
    .g2 .tag { fill: #7d4e00; }
    .g2 .dot { fill: #9a6700; }
    .g3 .box { fill: #dafbe1; stroke: #1a7f37; }
    .g3 .tag { fill: #116329; }
    .g3 .dot { fill: #1a7f37; }

    @media (prefers-color-scheme: dark) {
      .band { fill: #151b23; stroke: #3d444d; }
      .hd { fill: #f0f6fc; }
      .sub { fill: #9198a1; }
      .ttl { fill: #f0f6fc; }
      .dsc { fill: #d1d9e0; }
      .num { fill: #0d1117; }
      .lbl { fill: #9198a1; }
      .arw { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .g0 .box { fill: #151b23; stroke: #656d76; }
      .g0 .tag { fill: #9198a1; }
      .g1 .box { fill: #121d2f; stroke: #4493f8; }
      .g1 .tag { fill: #79c0ff; }
      .g1 .dot { fill: #4493f8; }
      .g2 .box { fill: #2a2111; stroke: #d29922; }
      .g2 .tag { fill: #e3b341; }
      .g2 .dot { fill: #d29922; }
      .g3 .box { fill: #12261e; stroke: #3fb950; }
      .g3 .tag { fill: #56d364; }
      .g3 .dot { fill: #3fb950; }
    }
  </style>
  <defs>
    <marker id="rp-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="head" d="M0 0 10 5 0 10z"/>
    </marker>
  </defs>
  <rect class="band" x="30" y="20" width="840" height="184" rx="12"/>
  <text class="hd" x="54" y="56">Ingestion, ahead of time</text>
  <text class="sub" x="54" y="78">Runs when the sources change</text>
  <g class="g1" transform="translate(54 96)">
    <rect class="box" width="174" height="84" rx="10"/>
    <text class="ttl" x="18" y="36">Sources</text>
    <text class="dsc" x="18" y="62">Notes, docs, wikis</text>
  </g>
  <path class="arw" d="M231 138H255" marker-end="url(#rp-head)"/>
  <g class="g1" transform="translate(260 96)">
    <rect class="box" width="174" height="84" rx="10"/>
    <text class="ttl" x="18" y="36">Chunk</text>
    <text class="dsc" x="18" y="62">Split into passages</text>
  </g>
  <path class="arw" d="M437 138H461" marker-end="url(#rp-head)"/>
  <g class="g1" transform="translate(466 96)">
    <rect class="box" width="174" height="84" rx="10"/>
    <text class="ttl" x="18" y="36">Embed</text>
    <text class="dsc" x="18" y="62">One vector each</text>
  </g>
  <path class="arw" d="M643 138H667" marker-end="url(#rp-head)"/>
  <g class="g1" transform="translate(672 96)">
    <rect class="box" width="174" height="84" rx="10"/>
    <text class="ttl" x="18" y="36">Index</text>
    <text class="dsc" x="18" y="62">Vectors, metadata</text>
  </g>
  <rect class="band" x="30" y="260" width="840" height="184" rx="12"/>
  <text class="hd" x="54" y="296">Query, just in time</text>
  <text class="sub" x="54" y="318">Runs for each question</text>
  <path class="arw" d="M759 184V232H553V330" marker-end="url(#rp-head)"/>
  <g class="g2" transform="translate(54 336)">
    <rect class="box" width="174" height="84" rx="10"/>
    <text class="ttl" x="18" y="36">Question</text>
    <text class="dsc" x="18" y="62">In plain words</text>
  </g>
  <path class="arw" d="M231 378H255" marker-end="url(#rp-head)"/>
  <g class="g2" transform="translate(260 336)">
    <rect class="box" width="174" height="84" rx="10"/>
    <text class="ttl" x="18" y="36">Embed</text>
    <text class="dsc" x="18" y="62">The same way</text>
  </g>
  <path class="arw" d="M437 378H461" marker-end="url(#rp-head)"/>
  <g class="g2" transform="translate(466 336)">
    <rect class="box" width="174" height="84" rx="10"/>
    <text class="ttl" x="18" y="36">Match</text>
    <text class="dsc" x="18" y="62">Top similar chunks</text>
  </g>
  <path class="arw" d="M643 378H667" marker-end="url(#rp-head)"/>
  <g class="g2" transform="translate(672 336)">
    <rect class="box" width="174" height="84" rx="10"/>
    <text class="ttl" x="18" y="36">Answer</text>
    <text class="dsc" x="18" y="62">Built from them</text>
  </g>
</svg>
