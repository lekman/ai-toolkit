<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="rt-title rt-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="rt-title">How knowledge and live state reach an answer</title>
  <desc id="rt-desc">Two routes that end in one result. Knowledge that changes slowly, such as notes, docs, wikis and exported files, goes into a RAG index that is derived and can be rebuilt at any time. State that changes constantly, such as tickets, orders, calendars and inboxes, stays behind a connector that is queried at the moment of the question. Both feed one grounded answer.</desc>
  <style>
    .box { stroke-width: 2; }
    .band { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .hd { font-size: 18px; font-weight: 700; fill: #1f2328; }
    .sub { font-size: 14px; fill: #59636e; }
    .ttl { font-size: 20px; font-weight: 700; fill: #1f2328; }
    .dsc { font-size: 15px; fill: #32383f; }
    .tag { font-size: 12.5px; font-weight: 700; letter-spacing: 1.2px; }
    .col { font-size: 12.5px; font-weight: 700; letter-spacing: 1.2px; fill: #6f7780; }
    .lbl { font-size: 14px; font-weight: 600; fill: #6f7780; }
    .mid { text-anchor: middle; }
    .arw { stroke: #6f7780; stroke-width: 2.5; fill: none; }
    .head { fill: #6f7780; }

    .g1 .box { fill: #ddf4ff; stroke: #0969da; }
    .g1 .tag { fill: #0550ae; }
    .g2 .box { fill: #fff8c5; stroke: #9a6700; }
    .g2 .tag { fill: #7d4e00; }
    .g3 .box { fill: #dafbe1; stroke: #1a7f37; }
    .g3 .tag { fill: #116329; }

    @media (prefers-color-scheme: dark) {
      .band { fill: #151b23; stroke: #3d444d; }
      .hd { fill: #f0f6fc; }
      .sub { fill: #9198a1; }
      .ttl { fill: #f0f6fc; }
      .dsc { fill: #d1d9e0; }
      .col { fill: #9198a1; }
      .lbl { fill: #9198a1; }
      .arw { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .g1 .box { fill: #121d2f; stroke: #4493f8; }
      .g1 .tag { fill: #79c0ff; }
      .g2 .box { fill: #2a2111; stroke: #d29922; }
      .g2 .tag { fill: #e3b341; }
      .g3 .box { fill: #12261e; stroke: #3fb950; }
      .g3 .tag { fill: #56d364; }
    }
  </style>
  <defs>
    <marker id="rt-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="head" d="M0 0 10 5 0 10z"/>
    </marker>
  </defs>
  <g class="g1" transform="translate(30 24)">
    <rect class="box" width="250" height="124" rx="10"/>
    <text class="tag" x="18" y="32">KNOWLEDGE</text>
    <text class="ttl" x="18" y="68">Changes slowly</text>
    <text class="dsc" x="18" y="91">Notes, docs, wikis,</text>
    <text class="dsc" x="18" y="110">exported files and shares</text>
  </g>
  <path class="arw" d="M284 86H319" marker-end="url(#rt-head)"/>
  <g class="g1" transform="translate(325 24)">
    <rect class="box" width="250" height="124" rx="10"/>
    <text class="tag" x="18" y="32">INDEXED</text>
    <text class="ttl" x="18" y="68">RAG index</text>
    <text class="dsc" x="18" y="91">Derived, and can be</text>
    <text class="dsc" x="18" y="110">rebuilt at any time</text>
  </g>
  <g class="g2" transform="translate(30 172)">
    <rect class="box" width="250" height="124" rx="10"/>
    <text class="tag" x="18" y="32">STATE</text>
    <text class="ttl" x="18" y="68">Changes constantly</text>
    <text class="dsc" x="18" y="91">Tickets, orders,</text>
    <text class="dsc" x="18" y="110">calendars and inboxes</text>
  </g>
  <path class="arw" d="M284 234H319" marker-end="url(#rt-head)"/>
  <g class="g2" transform="translate(325 172)">
    <rect class="box" width="250" height="124" rx="10"/>
    <text class="tag" x="18" y="32">LIVE</text>
    <text class="ttl" x="18" y="68">Connector</text>
    <text class="dsc" x="18" y="91">Queried at the moment</text>
    <text class="dsc" x="18" y="110">of the question</text>
  </g>
  <path class="arw" d="M579 86H592V136H614" marker-end="url(#rt-head)"/>
  <path class="arw" d="M579 234H592V184H614" marker-end="url(#rt-head)"/>
  <g class="g3" transform="translate(620 98)">
    <rect class="box" width="250" height="124" rx="10"/>
    <text class="tag" x="18" y="32">RESULT</text>
    <text class="ttl" x="18" y="68">Grounded answer</text>
    <text class="dsc" x="18" y="91">Each source used</text>
    <text class="dsc" x="18" y="110">for what it fits</text>
  </g>
</svg>
